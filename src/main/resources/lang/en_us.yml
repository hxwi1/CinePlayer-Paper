"找不到屏幕 {}": "Screen not found: {0}"
"找不到屏幕 {}（/cineplay screens 看现有屏幕）": "Screen not found: {0} (/cineplay screens to list)"
"没有叫 {} 的屏幕": "No screen named {0}"
"还没有这块屏幕": "That screen does not exist yet"
"玩家不在线": "Player is not online"
