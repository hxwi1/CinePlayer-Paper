# CinePlay — English strings
#
# Key   = 中文原文（代码里写死的），`{}` 是通配，代表运行期拼进去的参数
# Value = 英文译文，`{0}` `{1}` … 是顺序占位
#
# 规则：
#   * 精确匹配优先；没有 `{}` 的条目只参与精确匹配
#   * 带 `{}` 的条目按字面量长度从长到短试，避免短模板抢走长句子
#   * 匹配不到的文案原样显示中文（宁可露中文，也不要露 key）
#
# 只翻译"玩家看得见"的文案；log 里的行（getLogger）不在这里，服主看日志用中文没关系。

